name: Release

on:
  push:
    branches:
      - main
      - develop
  # Manual trigger for recovery scenarios where the push-event run was
  # skipped by the `chore(release)` guard below (e.g. a human-authored
  # promotion PR whose title happens to start with `chore(release):`,
  # which then ends up in the merge commit body).
  workflow_dispatch:

# Serialise gh-pages publishers across workflows, scoped per branch.
# Both this workflow and docs.yml push to gh-pages via
# quarto-actions/publish.  Without a shared concurrency group they race
# on a push to main and the loser fails non-fast-forward
# ("cannot lock ref 'refs/heads/gh-pages'").  cancel-in-progress: false
# is mandatory: cancelling release mid-run would skip the PyPI publish.
# The group is keyed by branch (github.ref): a global group let a develop
# pre-release run sit in the same queue as the main release run, and a
# third entrant (the main Documentation run) then evicted the queued main
# release run -- so main releases were silently cancelled (e.g. PR #264).
# Branch-scoping keeps same-branch release/docs runs serialised on
# gh-pages while letting develop and main release independently.
concurrency:
  group: gh-pages-deploy-${{ github.ref }}
  cancel-in-progress: false

# Principle of Least Privilege: Base permissions are read-only
permissions: read-all

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    # Skip on commits whose message contains `chore(release)` — semantic-release
    # generates exactly that prefix for its auto-bump commits, and re-running
    # the workflow on those would loop. WARNING: this is a substring match, so
    # human-authored PR titles that include `chore(release)` anywhere (e.g. a
    # promotion PR titled `chore(release): promote develop → main`) will also
    # trip the guard once GitHub places the PR title into the merge commit body.
    # If that happens, re-trigger via the `workflow_dispatch` button on the
    # Actions tab.
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'chore(release)')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          cache-dependency-glob: "pyproject.toml"

      - name: Resolve dependency graph
        # uv.lock is not checked in. Regenerate it so tests/test_prohibited_dependencies.py
        # greps a real file and the SBOM export below reflects the same closure.
        run: uv lock

      - name: Install dependencies
        run: |
          uv pip install --system build twine
          uv pip install --system -e ".[dev]"

      - name: Run tests
        run: |
          if [[ ! -f uv.lock ]]; then
            echo "::error::uv.lock missing before tests - prohibited-deps gate cannot run"
            exit 1
          fi
          pytest tests/ -v
      
      - name: Verify package name in pyproject.toml
        run: |
          grep -q "name = \"spotforecast2-safe\"" pyproject.toml || (echo "ERROR: Package name mismatch in pyproject.toml" && exit 1)
          echo "✓ Package name verified: spotforecast2-safe"
      
      # NOTE: the distribution is built exactly once — by semantic-release's
      # `python -m build` prepare step below, AFTER the version bump — so the
      # wheel and sdist carry the released version. SBOM generation, CPE
      # injection and Sigstore signing therefore run AFTER semantic-release
      # (see "Sign and publish the released artifact" below), operating on that
      # single, correct artifact. Building and signing here (before the bump)
      # produced a stale pre-bump wheel that was signed but never published.

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
      
      - name: Install semantic-release
        run: |
          npm install -g semantic-release@23 \
            @semantic-release/git@10 \
            @semantic-release/changelog@6 \
            @semantic-release/exec@6 \
            conventional-changelog-conventionalcommits@7
      
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: npx semantic-release

      # ── Sign and publish the released artifact ────────────────────────────
      # Everything below runs only when semantic-release actually cut a release:
      # its version-bump prepare step writes `.released-tag` with the git tag
      # (see .releaserc.json), so `hashFiles('.released-tag')` is non-empty
      # exactly when a release happened. By this point semantic-release has
      # bumped the version, built the wheel + sdist via `python -m build`, and
      # created the GitHub Release with those artifacts attached. We now build
      # the SBOM, sign the *released* artifacts, and attach the SBOM +
      # signatures to that same release.
      - name: Generate CycloneDX SBOM from uv.lock
        if: success() && hashFiles('.released-tag') != ''
        run: |
          # CycloneDX 1.5 SBOM of the resolved production dependency graph,
          # exported directly from uv.lock (no extra tool in the build env).
          uv export --preview-features sbom-export \
            --format cyclonedx1.5 --no-dev \
            -o dist/sbom.cdx.json
          echo "CycloneDX 1.5 SBOM generated:"
          ls -lah dist/sbom.cdx.json

      - name: Inject project CPE on SBOM root component
        if: success() && hashFiles('.released-tag') != ''
        # NVD-backed scanners (CISA KEV, several VM-aaS products) resolve via
        # CPE 2.3. Inject the project's own CPE (spotforecast2_safe.utils.cpe.
        # get_cpe_identifier) onto the root component before signing so the CPE
        # ships inside the signed artefact.
        run: |
          python scripts/enrich_sbom_with_cpe.py --sbom dist/sbom.cdx.json

      - name: Sign wheel, sdist, and SBOM with Sigstore
        if: success() && hashFiles('.released-tag') != ''
        # Keyless OIDC signing backed by the job's id-token: write permission;
        # no long-lived secrets. Bundles land in the public Rekor transparency
        # log, written next to each input as ``<input>.sigstore.json`` (v3+).
        # These are the released-version artifacts built by semantic-release.
        uses: sigstore/gh-action-sigstore-python@f514d46b907ebcd5bedc05145c03b69c1edd8b46  # v3.0.0
        with:
          inputs: |
            ./dist/*.whl
            ./dist/*.tar.gz
            ./dist/sbom.cdx.json

      - name: Attach SBOM and signatures to the GitHub Release
        if: success() && hashFiles('.released-tag') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # semantic-release already attached the wheel + sdist. Add the SBOM and
        # the Sigstore bundles to the same release; the wheel/sdist they cover
        # are byte-identical to the attached ones. --clobber keeps re-runs idempotent.
        run: |
          gh release upload "$(cat .released-tag)" \
            dist/sbom.cdx.json dist/*.sigstore* --clobber

      - name: Prune non-distribution artefacts from dist/
        if: success() && hashFiles('.released-tag') != ''
        # PyPI's upload path rejects anything twine can't recognise as a wheel
        # or sdist, so remove the SBOM and sigstore bundles before publishing.
        run: |
          rm -f dist/sbom.cdx.json dist/*.sigstore dist/*.sigstore.json
          ls -lah dist/

      - name: Publish to PyPI
        if: success() && hashFiles('.released-tag') != ''
        uses: pypa/gh-action-pypi-publish@f7600683efdcb7656dec5b29656edb7bc586e597  # release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          # Note: No token needed with Trusted Publishers (OIDC)

      # ── Documentation (main only) ─────────────────────────────────────────
      # Docs reflect the released (main) version and must NOT be rebuilt or
      # deployed from develop rc releases: that wasted ~18 min on every develop
      # merge and overwrote the production docs on gh-pages with rc content.
      # PyPI publish above has already happened, so gating the doc render here
      # never delays package availability. The freeze cache (see _quarto.yml)
      # turns the ~18 min render into seconds when documents are unchanged.
      - name: Restore Quarto freeze cache
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: _freeze
          key: quarto-freeze-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            quarto-freeze-${{ runner.os }}-

      - name: Install Quarto CLI
        if: success() && github.ref == 'refs/heads/main'
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b  # v2.2.0
        with:
          version: "1.7.29"

      - name: Generate API reference stubs
        if: success() && github.ref == 'refs/heads/main'
        run: |
          uv run python docs/quartodoc_build.py
          uv run quartodoc interlinks

      - name: Build documentation
        if: success() && github.ref == 'refs/heads/main'
        run: |
          uv run quarto render --no-cache

      - name: Setup Git Credentials for Publish
        if: success() && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

      - name: Deploy documentation
        if: success() && github.ref == 'refs/heads/main'
        uses: quarto-dev/quarto-actions/publish@8a96df13519ee81fd526f2dfca5962811136661b  # v2.2.0
        with:
          target: gh-pages
          path: _site
          render: "false"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Verify PyPI Release
        if: success()
        run: |
          echo "Release completed successfully!"
          echo "Verifying package on PyPI..."
          for i in {1..30}; do
            if python -c "import urllib.request; urllib.request.urlopen('https://pypi.org/project/spotforecast2-safe/')" 2>/dev/null; then
              echo "✓ Package found on PyPI"
              break
            fi
            if [ $i -lt 30 ]; then
              echo "Waiting for PyPI to sync (attempt $i/30)..."
              sleep 10
            fi
          done

  # After a final release on main, merge main back into develop so that
  # CHANGELOG.md and pyproject.toml are in sync. Without this step,
  # both branches diverge on these files (main has "1.2.3", develop still
  # has "1.2.3-rc.N" from the last pre-release commit) and every subsequent
  # PR from develop -> main produces a conflict.
  back-merge:
    name: Sync main into develop
    runs-on: ubuntu-latest
    needs: release
    # Only run after a successful final release on main, not on develop rc releases.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          # Use the PAT so the push is authenticated.
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into develop
        run: |
          git fetch origin
          git checkout develop
          # -X theirs: when CHANGELOG.md / pyproject.toml conflict (both were
          # updated from the same rc base), keep main's final release version.
          git merge origin/main -X theirs --no-ff \
            -m "chore: sync main into develop [skip ci]"
          git push origin develop
