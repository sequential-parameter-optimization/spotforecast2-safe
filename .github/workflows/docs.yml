# =============================================================================
# .github/workflows/docs.yml  —  Documentation Build & Deploy
# =============================================================================
# Replaces the previous MkDocs-based workflow.
#
# Pipeline:
#   1. Checkout (full history — needed for quartodoc and git-based versioning)
#   2. Set up Python + uv
#   3. Install Python deps (including quartodoc, from pyproject.toml [dev])
#   4. Install Quarto CLI (PINNED version — never float in safety-critical CI)
#   5. Verify Quarto installation integrity
#   6. Generate API reference stubs with quartodoc
#   7. Render the full Quarto site
#   8. Publish rendered output to the gh-pages branch
#
# ⚠️  Version pinning policy:
#     Update QUARTO_VERSION deliberately and document the reason in the commit
#     message.  During a certification or audit cycle, do NOT update this pin
#     without re-running the full verification checklist.
# =============================================================================

name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '_quarto.yml'
      - 'src/spotforecast2_safe/**'
      - 'pyproject.toml'
  workflow_dispatch:

# ---------------------------------------------------------------------------
# Serialise gh-pages publishers across workflows, scoped per branch.
# Both this workflow and release.yml push to gh-pages via
# quarto-actions/publish.  Without a shared concurrency group they race
# on a push to main and the loser fails non-fast-forward
# ("cannot lock ref 'refs/heads/gh-pages'").  cancel-in-progress: false
# is mandatory: cancelling release.yml mid-run would skip the PyPI
# publish step.
# The group is keyed by branch (github.ref) to match release.yml: this
# workflow only runs on main, so it shares the main group with the main
# release run (still serialised), while a develop release run lives in a
# separate group and can no longer evict the main release run.
# ---------------------------------------------------------------------------
concurrency:
  group: gh-pages-deploy-${{ github.ref }}
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# Principle of Least Privilege: base permissions are read-only.
# The deploy job elevates only what it needs (contents: write).
# ---------------------------------------------------------------------------
permissions: read-all

# ---------------------------------------------------------------------------
# Pinned versions — change these deliberately, never via Dependabot auto-merge.
# ---------------------------------------------------------------------------
env:
  QUARTO_VERSION: "1.7.29"
  PYTHON_VERSION: "3.13"

jobs:
  deploy-docs:
    name: Build & Deploy Documentation
    runs-on: ubuntu-latest

    permissions:
      contents: write   # push to gh-pages branch

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout (full history)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0   # full history required for quatordoc interlinks

      # ── 2. Python ────────────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ── 3. uv ────────────────────────────────────────────────────────────
      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          cache-dependency-glob: "pyproject.toml"

      # ── 4. Python dependencies ───────────────────────────────────────────
      # Installs the package in editable mode plus the [dev] group which
      # now contains quartodoc (see pyproject.toml).
      - name: Install Python dependencies
        run: |
          uv sync --group dev

      # ── 5. Quarto CLI (pinned) ────────────────────────────────────────────
      - name: Install Quarto CLI ${{ env.QUARTO_VERSION }}
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b  # v2.2.0
        with:
          version: ${{ env.QUARTO_VERSION }}

      # ── 6. Verify Quarto integrity ────────────────────────────────────────
      # `quarto check` verifies the installation, Pandoc, knitr/Jupyter kernels.
      # A failing check aborts the pipeline before any rendering occurs.
      - name: Verify Quarto installation
        run: quarto check

      # ── 7. Generate API reference stubs ───────────────────────────────────
      # quartodoc reads _quarto.yml (the `quartodoc:` section) and writes
      # .qmd stubs to docs/reference/.  Must run before `quarto render`.
      - name: Generate API reference with quartodoc
        run: |
          # docs/quartodoc_build.py patches a griffe/quartodoc incompatibility
          # (missing DocstringSectionWarns renderer) then runs the normal build.
          uv run python docs/quartodoc_build.py
          uv run quartodoc interlinks  # build interlink inventory for cross-refs

      # ── 8. Render Quarto site ─────────────────────────────────────────────
      # --no-cache: ensures a fully reproducible, audit-clean render.
      # Remove --no-cache only if build time becomes unacceptable and you
      # have verified cache invalidation is reliable.
      - name: Render Quarto site
        run: uv run quarto render --no-cache

      # ── 9. Deploy to GitHub Pages (gh-pages branch) ───────────────────────
      # The quarto-actions/publish action creates a clean commit on gh-pages.
      # It does NOT force-push, preserving the branch history for auditability.
      - name: Deploy to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@8a96df13519ee81fd526f2dfca5962811136661b  # v2.2.0
        with:
          target: gh-pages
          path: _site
          render: "false"   # already rendered in step 8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
